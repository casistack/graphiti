services:
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.2}
    restart: ${RESTART_POLICY:-always}
    volumes:
      - graphiti_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-zepzepzep}"
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "${NEO4J_DOMAIN:-localhost}"
      NEO4J_browser_allow__outgoing__connections: "true"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_jvm_additional: "-Dunsupported.dbms.udc.source=docker"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_pagecache_size: 2048M
      NEO4J_server_memory_heap_initial__size: 2048M
      NEO4J_server_threads_worker__count: 8
    ports:
      - "7474:7474"
      - "7687:7687"

  graphiti_mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile-mine
    restart: ${RESTART_POLICY:-always}
    depends_on:
      neo4j:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Neo4j to become available...' &&
      for i in {1..120}; do
        sleep 5
        if nc -z neo4j 7687 2>/dev/null; then
          echo 'Neo4j is available, starting MCP...'
          break
        fi
        echo 'Neo4j not available yet, waiting... (attempt $$i/120)'
      done &&
      uv run main.py --database-provider neo4j --config config/config-docker-neo4j.yaml
      "
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-zepzepzep}"
      MODEL_NAME: "${MODEL_NAME:-gpt-4o-mini}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-text-embedding-3-small}"
      EMBEDDER_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-text-embedding-3-small}"
      GRAPHITI_GROUP_ID: "${MCP_GROUP_ID:-default_group}"
      SEMAPHORE_LIMIT: "${SEMAPHORE_LIMIT:-10}"
      CONFIG_PATH: "config/config-docker-neo4j.yaml"
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    ports:
      - "8282:8000" # Exposing on a different port to avoid conflicts with your graph API

  graph:
    build:
      context: .
      dockerfile: ${GRAPHITI_DOCKERFILE:-Dockerfile-mine}
    restart: ${RESTART_POLICY:-always}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')",
        ]
      interval: 10s
      timeout: 90s
      retries: 5
    # Add a custom entry point that waits for Neo4j
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Neo4j to become available...' &&
      for i in {1..120}; do
        sleep 5
        if nc -z neo4j 7687 2>/dev/null; then
          echo 'Neo4j is available, starting Graphiti...'
          break
        fi
        echo 'Neo4j not available yet, waiting... (attempt $$i/120)'
      done &&
      uvicorn graph_service.main:app --host 0.0.0.0 --port 8000
      "
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zepzepzep}
      PORT: 8000
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      db_backend: neo4j
    ports:
      - ":8000"

volumes:
  graphiti_neo4j_data:
