services:
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.2}
    restart: ${RESTART_POLICY:-always}
    ports:
      - ":7474"
      - ":${NEO4J_PORT:-7687}"
    volumes:
      - graphiti_neo4j_data:/data
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-zepzepzep}
      - NEO4J_server_memory_pagecache_size=${NEO4J_MEMORY_PAGECACHE:-512M}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_MEMORY_HEAP_INITIAL:-512M}
      - NEO4J_server_memory_heap_max__size=${NEO4J_MEMORY_HEAP_MAX:-1G}
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=${NEO4J_ACCEPT_LICENSE_AGREEMENT:-yes}

  graph:
    image: ${GRAPHITI_IMAGE:-graphiti-server}:${GRAPHITI_TAG:-latest}
    restart: ${RESTART_POLICY:-always}
    build:
      context: .
      dockerfile: ${GRAPHITI_DOCKERFILE:-Dockerfile}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-8000}/healthcheck')",
        ]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${GRAPH_HEALTHCHECK_START_PERIOD:-15s}
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:${NEO4J_PORT:-7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-zepzepzep}
      - PORT=${PORT:-8000}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - USE_PARALLEL_RUNTIME=${USE_PARALLEL_RUNTIME:-false}
    ports:
      - ":${PORT:-8000}"

volumes:
  graphiti_neo4j_data:
